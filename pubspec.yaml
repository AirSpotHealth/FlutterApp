name: airspothealth
description: App for Airspot Health
publish_to: none # Remove this line if you wish to publish to pub.dev

version: 3.0.0+30

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^14.3.0
  flutter_riverpod: ^2.6.1
  isar: ^4.0.0-dev.14
  isar_flutter_libs: ^4.0.0-dev.14
  permission_handler: ^11.3.1
  flutter_blue_plus: ^1.33.5
  path_provider: ^2.1.4
  webview_flutter: ^4.10.0
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.2
  dio: ^5.7.0
  home_widget: ^0.7.0
  nordic_dfu: ^6.2.0
  file_picker: ^8.1.3
  intl: ^0.19.0
  flutter_echarts: ^2.5.0
  shimmer: ^3.0.0
  package_info_plus: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

flutter_launcher_icons:
  android: launcher_icon
  ios: true
  image_path: assets/images/airspot_1024.png
  min_sdk_android: 23 # android min sdk min:16, default 21
  remove_alpha_ios: true # remove alpha channel for ios, default true
  adaptive_icon_background: "#ffffff" # adaptive icon background color, default #ffffff
  adaptive_icon_foreground: assets/images/airspot_1024.png # adaptive icon foreground image path, default: undefined
