name: airspothealth
description: App for Airspot Health
publish_to: none # Remove this line if you wish to publish to pub.dev

version: 3.2.15+75

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^14.8.0
  flutter_riverpod: ^2.6.1
  isar: ^4.0.0-dev.14
  isar_flutter_libs: ^4.0.0-dev.14
  permission_handler: ^11.4.0
  flutter_blue_plus: ^1.35.3
  path_provider: ^2.1.5
  webview_flutter: ^4.10.0
  url_launcher: ^6.3.1
  shared_preferences: ^2.5.2
  dio: ^5.8.0+1
  home_widget: ^0.7.0+1
  nordic_dfu: ^6.2.0
  file_picker: ^9.0.0
  intl: ^0.20.2
  shimmer: ^3.0.0
  package_info_plus: ^8.2.1
  file_saver: ^0.2.14
  new_version_plus: ^0.1.0
  awesome_notifications_core: ^0.10.1
  awesome_notifications: ^0.10.1
  syncfusion_flutter_sliders: ^28.2.6
  font_awesome_flutter: ^10.8.0
  animated_icon: ^0.0.9
  geolocator: ^13.0.2
  share_plus: ^10.1.4
  system_date_time_format: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15

flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

flutter_launcher_icons:
  android: launcher_icon
  ios: true
  image_path: assets/images/airspot_1024.png
  min_sdk_android: 23 # android min sdk min:16, default 21
  remove_alpha_ios: true # remove alpha channel for ios, default true
  adaptive_icon_background: "#ffffff" # adaptive icon background color, default #ffffff
  adaptive_icon_foreground: assets/images/airspot_1024.png # adaptive icon foreground image path, default: undefined
