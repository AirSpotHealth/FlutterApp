name: airspothealth
description: App for Airspot Health
publish_to: none # Remove this line if you wish to publish to pub.dev

version: 3.8.4+152

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.9
  go_router: ^17.2.3
  flutter_riverpod: ^2.6.1
  permission_handler: ^12.0.3
  flutter_blue_plus: ^2.3.4
  path_provider: ^2.1.5
  webview_flutter: ^4.13.1
  url_launcher: ^6.3.2
  crypto: ^3.0.7
  shared_preferences: ^2.5.5
  dio: ^5.9.2
  http: ^1.6.0
  home_widget: ^0.9.2
  nordic_dfu: ^7.1.2
  file_picker: ^11.0.2
  intl: ^0.20.2
  shimmer: ^3.0.0
  mcumgr_flutter: ^0.9.1
  archive: ^4.0.9
  package_info_plus: ^9.0.1
  file_saver: ^0.4.0
  new_version_plus: ^1.0.1
  # awesome_notifications_core: ^0.10.1
  flutter_local_notifications: ^21.0.0
  # awesome_notifications: ^0.10.1
  firebase_core: ^4.9.0
  firebase_messaging: ^16.2.2
  font_awesome_flutter: ^11.0.0
  animated_icon: ^1.0.0
  geolocator: ^14.0.2
  share_plus: ^12.0.2
  system_date_time_format: ^1.5.0
  bottom_picker: ^4.1.1
  pointycastle: ^4.0.0
  vibration: ^3.1.8
  isar_plus: ^1.3.6
  isar_plus_flutter_libs: ^1.3.6
  supabase_flutter: ^2.12.4
  sign_in_with_apple: ^8.1.0
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0

flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - shorebird.yaml
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

flutter_launcher_icons:
  android: launcher_icon
  ios: true
  image_path: assets/images/airspot_1024.png
  min_sdk_android: 23 # android min sdk min:16, default 21
  remove_alpha_ios: true # remove alpha channel for ios, default true
  adaptive_icon_background: "#ffffff" # adaptive icon background color, default #ffffff
  adaptive_icon_foreground: assets/images/airspot_1024.png # adaptive icon foreground image path, default: undefined
