<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <!--    <title>d</title>-->
  <script src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js"></script>
</head>

<body>
  <div id="chart" style="width: 100%; height: 100vh;"></div>
  <script>
    var chart = echarts.init(document.getElementById('chart'));

    function setOption(option) {
      chart.setOption(option);
    }

    // Optional: Default chart options
    var defaultOption = {
      title: {
        text: ''
      },
      tooltip: {
        trigger: 'axis',
      },
      xAxis: {
        data: ['A', 'B', 'C', 'D', 'E']
      },
      yAxis: {},
      visualMap: {
        top: 50,
        right: 10,
        pieces: [
          {
            gt: 0,
            lte: 800,
            color: '#63A103'
          },
          {
            gt: 800,
            lte: 1000,
            color: '#FE9A23'
          },
          {
            gt: 1000,
            color: '#D9001B'
          }
        ],
        outOfRange: {
          color: '#D9001B'
        }
      },
      series: [{
        type: 'line',
        data: [5, 20, 36, 10, 10]
      }]
    };
    chart.setOption(defaultOption);
  </script>
</body>

</html>
